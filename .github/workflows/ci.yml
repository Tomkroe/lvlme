name: CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Expo-Pakete passend zum SDK installieren
        run: |
          if ! grep -q '"expo-router"' package.json; then npm run setup-deps; fi
          npx expo install --check || npx expo install --fix
      - name: Web-Pakete (Windows/PC-Version)
        run: |
          grep -q '"react-native-web"' package.json || npx expo install react-native-web @expo/metro-runtime -- --no-audit --no-fund
      - name: Typen prüfen
        run: npx tsc --noEmit
      - name: Tests (Spielregeln)
        run: npm test
      - name: Expo Doctor
        run: npx expo-doctor || true
      - name: Prebuild-Probe (iOS-Konfiguration erzeugen)
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Web-Version bauen (gleicher Code wie die iPhone-App)
        env:
          # Öffentliche Werte (stehen auch in docs/web-alt/index.html); Zugriff regelt RLS in Supabase
          EXPO_PUBLIC_SUPABASE_URL: https://xvinbohxqofkwlrmrwao.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ETTbcormpZjj5FACAXfV1Q_013dVmAA
        run: npx expo export --platform web --output-dir dist
      - name: Web-Version und angepasste Versionen zurückschreiben
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf docs/web && cp -r dist docs/web
          # Direkt aufgerufene Unterseiten (z. B. nach Neuladen) landen auf GitHub Pages sonst auf einer 404-Seite
          cp dist/index.html docs/404.html
          git config user.name "lvlme-ci"
          git config user.email "ci@users.noreply.github.com"
          git add package.json package-lock.json docs/web docs/404.html
          if ! git diff --cached --quiet; then
            git commit -m "CI: Web-Version (docs/web) und Abhängigkeiten aktualisiert"
            git pull --rebase origin main && git push
          fi

  build-ios:
    # Manuell starten, sobald EXPO_TOKEN als Secret hinterlegt ist und der erste Build einmal am PC lief
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: iOS-Build bei EAS starten
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform ios --profile preview --non-interactive --no-wait
